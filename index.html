        <path d="M27 9.5A12 12 0 1 0 30.5 27 10 10 0 0 1 27 9.5Z" fill="#ecca82"/>
        <g fill="#f2b4c6" transform="translate(25 25)"><circle r="2.2" cy="-3"/><circle r="2.2" cx="2.85" cy="-.93"/><circle r="2.2" cx="1.76" cy="2.43"/><circle r="2.2" cx="-1.76" cy="2.43"/><circle r="2.2" cx="-2.85" cy="-.93"/><circle r="1" fill="#8a6a2c"/></g>
      </svg>
      <span class="logo-text"><b>월화</b><small>月花</small></span>
    </a>
    <div class="top-tools">
      <button class="search-btn" id="searchBtn" type="button" aria-label="가이드 검색 (단축키 /)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</nav>

<main id="view" tabindex="-1"></main>

<footer class="foot" id="foot"></footer>

<nav class="tabbar" id="tabbar" aria-label="모바일 바로가기">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>홈</a>

  <a href="#penalty" data-tab="penalty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>제재</a>

</nav>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="위키 검색" hidden>
  <div class="pal">
    <div class="pal-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="palInput" class="sr">검색어</label>
      <input id="palInput" type="search" placeholder="조 번호(33), 제재 코드(W-7), 단어(철수, 엔더 상자)" autocomplete="off" role="combobox" aria-controls="palResults" aria-expanded="true" enterkeyhint="search">
      <button type="button" id="palClose" aria-label="검색 닫기">ESC</button>
    </div>
    <div class="chips pal-chips" id="palChips" role="group" aria-label="카테고리 필터"></div>
    <div class="pal-results" id="palResults" role="listbox" aria-label="검색 결과"></div>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> 이동</span><span><kbd>Enter</kbd> 열기</span><span><kbd>Esc</kbd> 닫기</span><span id="palCount"></span></div>
  </div>
</div>
