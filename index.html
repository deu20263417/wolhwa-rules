<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>월화서버</title>
<meta name="description" content="월화(月花) 생존형 제한 약탈 서버 공식 규칙. 전체 규칙, 전쟁·약탈 절차, 제재 기준, 판정 사례, FAQ.">
<meta name="theme-color" content="#120e19">
<meta property="og:type" content="website">

<meta property="og:description" content="약탈은 자유롭게, 전쟁은 법도 있게. 월화 생존형 제한 약탈 서버의 전체 규칙과 제재 기준.">
<meta property="og:image" content="https://deu20263417.github.io/wolhwa-rules/img/hero-1200.jpg">
<meta property="og:url" content="https://deu20263417.github.io/wolhwa-rules/">
<link rel="canonical" href="https://deu20263417.github.io/wolhwa-rules/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" type="image/webp" href="img/hero-1200.webp" imagesrcset="img/hero-800.webp 800w, img/hero-1200.webp 1200w, img/hero-1672.webp 1672w" imagesizes="100vw" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="progress" id="progress" aria-hidden="true"></div>

<header class="top" id="top">
  <div class="wrap">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="메뉴 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="logo" href="#home" aria-label="월화 홈">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-opacity=".35"/>
        <path d="M27 9.5A12 12 0 1 0 30.5 27 10 10 0 0 1 27 9.5Z" fill="#ecca82"/>
        <g fill="#f2b4c6" transform="translate(25 25)"><circle r="2.2" cx="0" cy="-3"/><circle r="2.2" cx="2.85" cy="-.93"/><circle r="2.2" cx="1.76" cy="2.43"/><circle r="2.2" cx="-1.76" cy="2.43"/><circle r="2.2" cx="-2.85" cy="-.93"/><circle r="1" fill="#8a6a2c"/></g>
      </svg>
      <b>월화</b><small>月花</small>
    </a>
    <nav class="gnb" aria-label="주 메뉴">
      <a href="#home" data-nav="home">홈</a>
      <a href="#rules" data-nav="rules">전체 규칙</a>
      <a href="#penalty" data-nav="penalty">제재 안내</a>
      <a href="#faq" data-nav="faq">FAQ</a>
      <a href="#report" data-nav="report">신고·문의</a>
      <a href="#admin" data-nav="admin" class="admin-link">관리</a>
    </nav>
    <div class="top-tools">
      <button class="search-btn" id="searchBtn" type="button" aria-label="규칙 검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>규칙 번호·단어 검색</span><kbd>/</kbd>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="테마 바꾸기" title="테마 바꾸기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<main id="view" tabindex="-1"></main>

<footer class="foot" id="foot"></footer>

<nav class="tabbar" id="tabbar" aria-label="모바일 메뉴">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>홈</a>
  <a href="#rules" data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6zM9 10h7M9 14h7M9 18h4"/></svg>규칙</a>
  <button type="button" id="tabSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>검색</button>
  <a href="#penalty" data-tab="penalty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>제재</a>
  <button type="button" id="tabMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>목록</button>
</nav>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="규칙 검색">
  <div class="pal">
    <div class="pal-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="palInput" class="sr">검색어</label>
      <input id="palInput" type="search" placeholder="조 번호(33), 제재 코드(W-7), 단어(철수, 엔더 상자)" autocomplete="off">
      <button type="button" id="palClose">ESC</button>
    </div>
    <div class="chips" id="palChips" role="group" aria-label="카테고리 필터"></div>
    <div class="pal-results" id="palResults" role="listbox" aria-label="검색 결과"></div>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> 이동</span><span><kbd>Enter</kbd> 열기</span><span><kbd>Esc</kbd> 닫기</span><span id="palCount"></span></div>
  </div>
</div>

<button class="to-top" id="toTop" type="button" aria-label="맨 위로">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script defer src="vendor/marked.min.js"></script>
<script defer src="js/status.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/admin.js"></script>
</body>
</html>
