# 월화 서버 상태 Worker 설정 (선택 사항)
# 배포: npx wrangler deploy  (Cloudflare 무료 플랜 범위에서 동작)
# 비밀 값은 넣지 않는다. 이 Worker는 비밀 값이 필요 없다.
name = "wolhwa-status"
main = "worker.js"
compatibility_date = "2024-09-01"

[vars]
MC_ADDRESS = ""            # 예: play.example.com
MC_EDITION = "java"        # java | bedrock
ALLOWED_ORIGINS = ""       # 예: https://wolhwa.pages.dev,https://username.github.io
CACHE_SECONDS = "60"
MAINTENANCE = "0"
MAINTENANCE_NOTE = ""
